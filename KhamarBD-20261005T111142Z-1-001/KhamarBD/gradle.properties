# ---- Java toolchain ----------------------------------------------------------
# PROBLEM ja chilo: ei PC te JAVA_HOME set-i chilo na, ar PATH e je 'java' ache
# seta Oracle javapath (Java 8) er shim:
#     C:\Program Files\Common Files\Oracle\Java\javapath\java.exe   -> java 8
# Tai terminal theke .\gradlew.bat chalale:
#     ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH
# Kintu JDK 21 agei install kora ache: C:\Program Files\Java\jdk-21
#   (verified: javac.exe + java.exe ache, "java version 21, build 21+35-LTS")
#
# Ei line project-er bhetorei JDK 21 fix kore dey, tai JAVA_HOME chara-o build cholbe.
# Sathe sathe user-level JAVA_HOME o set kora hoyeche (setx):
#     JAVA_HOME = C:\Program Files\Java\jdk-21
# PATH e Java 8 er javapath ta ekhono ache (onno course er jonno) - kintu ekhon
# JAVA_HOME ar org.gradle.java.home duita-e JDK 21 ke point kore, tai conflict nei.
#
# Portability NOTE: ei path ei machine er jonno. Onno PC te clone korle ei
# line ta comment kore din (othoba JAVA_HOME / "java.jdt.ls.java.home" use korun).
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.12

# ---- Gradle memory tuning ----------------------------------------------------
# Ei machine: Intel Core i5-6300U, 4 cores, 7GB RAM, Windows 10.
#
# Ager problem: project root-e 67 ta hs_err_pid*.log chilo, sobaguloi
# "There is insufficient memory for the Java Runtime Environment to continue"
# / "Native memory allocation (malloc) failed". Mul karon chilo
# .vscode/settings.json e Java Language Server ke -Xmx16G deowa (7GB RAM e!).
# Sei value ekhon -Xmx1G kora hoyeche.
#
# Ekhane Gradle-er dikeo limit rakha holo, jate process count ebong RAM usage kom lage.

# 512m agei proven enough (2026-10-01 er test run ei value-tei pass korechilo).
# Baraben na - ei machine e kom heap-i beshi safe.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m

# Prottek worker ekta alada JVM process, tar nijer heap. 4 core / 7GB RAM e
# onek worker ek shathe cholle RAM shesh hoye JVM crash kore.
org.gradle.workers.max=2
org.gradle.parallel=false

# Ek daemon reuse kora hoy - bar bar notun JVM na tule RAM bache.
org.gradle.daemon=true

# Agei jei kaaj hoyeche seta abar na kora (compile/output reuse).
org.gradle.caching=true
