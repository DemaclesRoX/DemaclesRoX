spring.application.name=KhamarBD
server.port=8081

# ---- H2 In-Memory Database (for local testing without MySQL) ----
# spring.datasource.url=jdbc:h2:mem:khamarbd;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# H2 console — open http://localhost:8080/h2-console to browse data
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3307/khamarbd2
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ---- Hibernate / JPA ----
# update: keeps existing data, only updates schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shows the actual SQL Hibernate runs, in the console — useful while learning
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Error debugging (dev only) ----
# Ei duto line chara 500 error er response e sudhu {timestamp,status,error,path}
# ashe - asol karon ta jana jay na. Ekhon message ta response body te dekhabe.
# PRODUCTION e ei duto comment kore deoya uchit (internal detail leak hoy).
server.error.include-message=always
server.error.include-binding-errors=always

# ---- Frontend Live Reload (dev only) ----
# Eitar fole server restart charai HTML/CSS er changes refresh korlei dekha jabe!
spring.web.resources.static-locations=file:src/main/resources/static/
